name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Standard GitHub-hosted runners only; they are free for public repositories.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Same build as the Homebrew formula.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
        run: go build -tags desktop,production -o "$RUNNER_TEMP/ghostty-tailor" .

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: go build -tags desktop,production,webkit2_41 -o "$RUNNER_TEMP/ghostty-tailor" .

      # Start the app on a virtual display and check it is still running after
      # 10 seconds (timeout exits with 124), i.e. GTK and WebKitGTK load.
      - name: Launch (Linux)
        if: runner.os == 'Linux'
        run: |
          code=0
          xvfb-run -a timeout 10 "$RUNNER_TEMP/ghostty-tailor" || code=$?
          test "$code" -eq 124
