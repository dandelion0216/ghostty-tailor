name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Standard GitHub-hosted runners only; they are free for public repositories.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Same build as the Homebrew formula.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
        run: go build -tags desktop,production -o "$RUNNER_TEMP/ghostty-tailor" .

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: go build -tags desktop,production,webkit2_41 -o "$RUNNER_TEMP/ghostty-tailor" .
